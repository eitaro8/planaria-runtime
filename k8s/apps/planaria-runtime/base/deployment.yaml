apiVersion: apps/v1
kind: Deployment
metadata:
  name: planaria-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: planaria-runtime
  template:
    metadata:
      labels:
        app: planaria-runtime
    spec:
      containers:
        - name: runtime
          image: planaria-runtime:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          resources:
            limits:
              cpu: "500m"
              memory: 512Mi
            requests:
              cpu: "100m"
              memory: 128Mi
